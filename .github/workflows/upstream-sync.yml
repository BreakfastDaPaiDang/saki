name: Saki upstream sync

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]

concurrency:
  group: saki-upstream-sync
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  configuration-required:
    if: github.event_name == 'workflow_dispatch' && vars.SAKI_AUTOMATION_CLIENT_ID == ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '::error::Configure SAKI_AUTOMATION_CLIENT_ID and SAKI_AUTOMATION_PRIVATE_KEY before dispatching upstream sync.'
          exit 1

  sync:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.SAKI_AUTOMATION_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Create Saki automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SAKI_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.SAKI_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master
          token: ${{ steps.app-token.outputs.token }}

      - name: Prepare or retain the upstream target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/maintenance/upstream.mjs prepare

  route-ci:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'automation/upstream-sync' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted maintenance code
        uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - name: Route current compatibility result
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/maintenance/upstream.mjs route-ci

  route-closed:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'automation/upstream-sync' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted maintenance code
        uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - name: Complete or cancel the closed target
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/maintenance/upstream.mjs route-closed
