- insert:
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: saki-storage-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      config:
        backend: sqlite
        path: ':memory:'
        journalMode: wal

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json
        routes:
          saki_control_plane: sqlite
          saki_host_execution: sqlite
          saki_storage_generation: sqlite

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    - id: session-persistence-jsonl
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')

    # Durable image bytes live outside the append-only Session log; messages
    # keep content-addressed references this backend resolves.
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'

    # Session cold reads, titles, and lineage traces stay mounted; content
    # search stays disabled, so search calls fail loud with
    # SESSION_QUERY_SEARCH_DISABLED and SQLite is never opened.
    - id: session-query-sqlite
      name: '@deepseek-ai/dsh-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        personaPrefix: ''
        personaSuffix: ''

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    # Transport-independent default model selection read when a Session is
    # created or resumed. Production installs no model adapter, so this named
    # route is never served: any actual model use fails loud at the point of
    # use, mirroring the control plane's absent modelRouteRequest, which leaves
    # agent dispatch unavailable.
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: saki-unconfigured
        model: saki-unconfigured

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    - id: session-checkpoint-policy
      name: '@deepseek-ai/dsh-session-checkpoint-policy'

    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: development
        includeShippedRoot: false
        includeUserRoot: false

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.cwd()

    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'

    - id: sandbox
      name: '@deepseek-ai/dsh-sandbox-local'

    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: workspace-write
        workspaceRoot: !!js process.cwd()

    - id: approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: never

    - id: shell-env
      name: '@deepseek-ai/dsh-shell-env'

    - id: pwsh-sandbox
      name: '@deepseek-ai/dsh-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: saki-execution-local
      name: '@breakfastdapaidang/saki-execution-local'

    - id: saki-credentials
      name: '@deepseek-ai/dsh-credentials-windows-dpapi'
      disabled: !!js process.platform !== 'win32'

    - id: saki-connection-credentials
      name: '@deepseek-ai/dsh-credentials-local'
      disabled: !!js process.platform === 'win32'

    - id: saki-github-app
      name: '@breakfastdapaidang/saki-github-app'
      inject:
        - credentials
      disabled: !!js process.platform !== 'win32'

    # ── Remote/RPC stack the DSH client services need ──

    - id: typert
      name: '@deepseek-ai/dsh-typert-registry'

    - id: typert-loader
      name: '@deepseek-ai/dsh-typert-loader'

    - id: typert-gateway
      name: '@deepseek-ai/dsh-api-gateway'

    - id: commands
      name: '@deepseek-ai/dsh-commands'

    - id: saki-webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: '127.0.0.1'
        port: !!js "(() => { const port = Number(process.env.SAKI_PORT ?? 43119); if (!Number.isInteger(port) || port < 0 || port > 65535) throw new Error('SAKI_PORT must be an integer from 0 through 65535'); return port })()"

    - id: saki-connection
      name: '@deepseek-ai/dsh-client-connection'
      config:
        trustedHosts: []

    - id: saki-control-plane
      name: '@breakfastdapaidang/saki-control-plane'
      inject:
        - webServer
      config:
        origin: !!js "'http://127.0.0.1:' + String(ctx.webServer.port)"
        challengeTtlMs: 900000
        sessionTtlMs: 43200000
        terminalRetentionMs: 604800000
        cookieName: saki_session
        defaultAgentProfile:
          agentPresetId: development

    - id: saki-host-api
      name: '@breakfastdapaidang/saki-host-api'

    # ── Host Remotes the browser services call ──

    # Resolves bind host, launch, and display once at boot, then mounts the
    # matching directory-picker backend and client surface as Loader entries;
    # the workspace controller's picker child serves remote.directoryPicker
    # over the backend.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    # Configuration-surface reads and writes over Typert Remote. Saki mounts
    # no settings provider, so each call answers the configuration API's
    # actionable missing-provider diagnostic.
    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    # Workspace commands and reconnect-safe projection over Typert Remote.
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    # ── browser surface: client module system + shell roster + dist serving ──

    # Dual-face: the node half scans this tree, composes window.__DSH_BOOT__,
    # and serves /plugins/<id>/client.js; the browser half is the module table.
    - id: modules
      name: '@deepseek-ai/dsh-client-modules'

    # Raw Blob and ReadableStream uploads run independently of Connection's
    # RPC: the host half provides the fileUploads service and streaming route,
    # the browser half the fileUpload client.
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    - id: locale
      name: '@deepseek-ai/dsh-client-locale'

    - id: ui-layout
      name: '@deepseek-ai/dsh-client-ui-layout'

    - id: ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'

    # Session standard seats (useSession, useSessions, the pending-interaction
    # hook) over the session controller's browser Sessions face.
    - id: ui-session
      name: '@deepseek-ai/dsh-client-ui-session'

    - id: ui-sidebar
      name: '@deepseek-ai/dsh-client-ui-sidebar'

    - id: ui-settings
      name: '@deepseek-ai/dsh-client-ui-settings'

    - id: ui-settings-general
      name: '@deepseek-ai/dsh-client-ui-settings-general'

    - id: ui-conversation
      name: '@deepseek-ai/dsh-client-ui-conversation'

    - id: ui-workspace
      name: '@deepseek-ai/dsh-client-ui-workspace'

    - id: ui-brand-official
      name: '@deepseek-ai/dsh-client-ui-brand-official'

    # Saki's own client plugin: the 工作/项目 entries over the shell slots.
    - id: saki-web-ui
      name: '@breakfastdapaidang/saki-web-ui'

    # Serves the built frontend dist through the webserver fallback seat.
    - id: saki-web-runtime
      name: '@breakfastdapaidang/saki-bundle/web-runtime'

    - id: saki-readiness
      name: '@breakfastdapaidang/saki-bundle'
