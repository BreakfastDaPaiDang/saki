# Saki's Development Agent capability whitelist. Host composition owns shared
# registries, persistence, model routing, and process confinement. This preset
# contributes only the prompt and tools one Project-scoped coding session uses.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Saki's Development Agent. Work on the assigned task in the session workspace, follow its repository instructions, and verify each change before reporting it complete.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    enableRunInBackground: false

# The control plane retains the Host's unrestricted local filesystem provider.
# Agent calls resolve this isolated enforcing provider instead, sharing the
# session workspace policy with PowerShell without changing Host operations.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-sandbox
      name: '@deepseek-ai/dsh-fs-sandbox'

    - id: fs-observation-policy
      name: '@deepseek-ai/dsh-fs-observation-policy'

    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
