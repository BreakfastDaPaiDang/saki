# Saki skill-preflight composition: the ordinary ACP example without a
# model-facing shell tool. Filesystem tools and repository skill discovery stay
# assembled so a user-invoked tracker workflow can diagnose the one missing
# capability before mutation.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-pro
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
          workspaceContext:
            maxBytes: 65536
          toolBash: false
          persona: You are a concise Saki preflight agent working in {{cwd}}. Stop before mutation when a required capability is absent.
